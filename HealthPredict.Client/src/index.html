<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>HealthPredict</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="description" content="HealthPredict - Sistema de monitoreo de salud predictivo">
  
  <!-- Configuración CRÍTICA para PWA iOS - Eliminar barra URL -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HealthPredict">
  
  <!-- Configuración PWA general -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#007bff">
  <meta name="msapplication-navbutton-color" content="#007bff">
  <meta name="msapplication-TileColor" content="#007bff">
  
  <!-- Prevenir comportamientos no deseados en iOS -->
  <meta name="format-detection" content="telephone=no">
  <meta name="format-detection" content="email=no">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons específicos para iOS -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167x167.png">
  
  <!-- Manifest para PWA -->
  <link rel="manifest" href="manifest.json">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
  <app-root></app-root>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('ServiceWorker registrado exitosamente: ', registration.scope);
            
            // Detectar actualizaciones del service worker
            registration.addEventListener('updatefound', function() {
              console.log('Nueva versión del Service Worker detectada');
              const newWorker = registration.installing;
              
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Nueva versión instalada, recargando...');
                  // Forzar actualización
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              });
            });
            
          }, function(err) {
            console.log('ServiceWorker falló al registrarse: ', err);
          });
      });
      
      // Escuchar cambios en el service worker
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        console.log('Service Worker actualizado, recargando página...');
        window.location.reload();
      });
    }
    
    // Función global para limpiar cache (útil para desarrollo)
    window.clearAppCache = function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(function(registration) {
          if (registration) {
            registration.active.postMessage({ type: 'CLEAR_CACHE' });
            console.log('Cache limpiado, recargando...');
            setTimeout(() => window.location.reload(), 1000);
          }
        });
      }
    };
  </script>
   
</body>
</html>
